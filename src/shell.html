<title>보라카이 가족 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 의도적으로 라이트 테마 하나만 사용 (휴대폰 다크 모드여도 밝은 화면 유지). Layout: 지도가 주인공인 한 손 조작 앱. 상단 인원·필터 → 지도 카드 → 가로 장소 카드 → 호텔 복귀 패널, 하단 탭. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E9EFEE; --ink:#10292C; --muted:#5A6E71; --line:#D9E3E2;
  --accent:#0B7A83; --accent-soft:#D7EEEF; --on-accent:#FFFFFF; --sun:#E38B1F; --sun-soft:#FCEBD3;
  --warn:#B24A22; --warn-soft:#F8E1D6; --ok:#2C7A4B; --ok-soft:#DCEFE3;
  --sea:#A8DADF; --land:#F0EDE5; --sand:#F5E5BE; --green:#D3E5C9; --pool:#86CFE3; --road:#FFFFFF; --casing:#D3CDBF; --path:#C2B79F; --label:#3E5457; --halo:rgba(255,255,255,.9);
  --c-restaurant:#CF5530; --c-cafe:#8B5A34; --c-convenience:#2A77B8; --c-pharmacy:#2A9258; --c-pub:#7448AE; --follow:#6A3FD0; --follow-soft:#ECE5FB; --c-money:#0E8A6E; --c-fruit:#D9A400;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light; --r:16px; --shadow:0 1px 2px rgba(16,41,44,.06),0 6px 20px rgba(16,41,44,.08);
}



:root.dark{
  /* 아이폰 다크 모드 톤: 차가운 무채색 + 파란 포인트, 카드와 배경 구분을 또렷하게 */
  --bg:#0B0C0E; --surface:#1A1C20; --surface-2:#26292E; --ink:#F2F3F5; --muted:#A8ACB3; --line:#33363C;
  --accent:#5EA2FF; --accent-soft:#16283F; --on-accent:#08162B; --sun:#F2A646; --sun-soft:#352B1A;
  --warn:#FF8A70; --warn-soft:#3A1F1A; --ok:#5FD08A; --ok-soft:#15301F;
  --sea:#0E2A36; --land:#1E2124; --sand:#3A3527; --green:#1F2B25; --pool:#1D5166; --road:#3A3E44; --casing:#0B0C0E; --path:#55524A; --label:#CDD2D8; --halo:rgba(11,12,14,.88);
  --c-restaurant:#FF8A5C; --c-cafe:#D19A6A; --c-convenience:#62A8FF; --c-pharmacy:#5FD08A; --c-pub:#B794F4; --follow:#B794F4; --follow-soft:#2A2440; --c-money:#4FD1B0; --c-fruit:#F4C752;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.45); color-scheme:dark }
:root.dark .panel,:root.dark .vc,:root.dark .chat,:root.dark .day,:root.dark details.fold{border-color:var(--line);box-shadow:var(--shadow)}
:root.dark .pin-notice{background:#3D2A23;border-color:#D97757}
:root.dark .pin-notice b{color:#F0A58A}
:root.dark .pin-notice .next{background:var(--surface)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:720px;margin:0 auto}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.party{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
.party label{font-size:13px;color:var(--muted);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:1}
.seg button{border:0;background:transparent;border-radius:10px;height:34px;font-weight:500;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

/* map */
.mapbox{position:relative;height:clamp(240px,37vh,500px);border-radius:20px;overflow:hidden;background:var(--sea);box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:0;background:none;transform:translate(-50%,-100%)}
.pin .b{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--pc);border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s,opacity .15s}
.pin svg{transform:rotate(45deg);width:15px;height:15px;color:#fff}
.pin.dim{opacity:.28}
.pin.dim .b{transform:rotate(-45deg) scale(.7)}
.pin.sel{z-index:3}
.pin.sel .b{transform:rotate(-45deg) scale(1.3);border-color:var(--ink)}
.pin .t{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-size:11.5px;font-weight:700;background:var(--surface);color:var(--ink);padding:1px 6px;border-radius:6px;box-shadow:var(--shadow);display:none}
.pin.sel .t{display:block}
.pin.h24 .b::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.hotelpin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;border:0;background:none;padding:0;z-index:4}
.hotelpin .b{display:flex;align-items:center;gap:5px;background:var(--sun);color:#1c1204;font-weight:700;font-size:12.5px;padding:5px 9px 5px 6px;border-radius:999px;border:2px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap}
.hotelpin svg{width:16px;height:16px}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:5}
.mapctl button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;font-weight:500}
.mapctl svg{width:20px;height:20px}
.attrib{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--label);background:var(--halo);padding:1px 5px;border-radius:4px;z-index:5}
.legend{position:absolute;left:8px;top:8px;font-size:11px;background:var(--halo);padding:3px 7px;border-radius:8px;z-index:5;color:var(--label)}

/* cards */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.sec-h h2{font-size:16px}
.sec-h span{font-size:12.5px;color:var(--muted)}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-4px;padding:2px 4px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 min(78%,300px);scroll-snap-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;text-align:left;display:grid;gap:6px;align-content:start}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card .k{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.card h3{font-size:16.5px;font-weight:700}
.card .ko{font-size:13px;color:var(--muted);margin-top:-4px}
.card .cost{font-size:15px;font-weight:700;line-height:1.3}
.card .cost small{font-weight:400;color:var(--muted);font-size:12.5px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:7px;margin-top:2px}
.card .more{border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:9px;padding:5px 10px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.sun{background:var(--sun-soft);color:var(--sun)}
.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;background:var(--surface);border-radius:var(--r);flex:1}

/* return panel */
.ret{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:10px;border:1px solid var(--line)}
.ret h3{font-size:15.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ret h3 .arrow{color:var(--sun)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:grid;gap:2px}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-size:18px}
.mode span{font-size:12.5px;color:var(--muted)}
.fare{display:grid;gap:4px;font-size:13.5px;background:var(--bg);border-radius:12px;padding:10px}
.fare div{display:flex;justify-content:space-between;gap:8px}
.fare .lbl{color:var(--muted)}
.rec{font-size:14px;font-weight:500}
.fine{font-size:12px;color:var(--muted);line-height:1.45}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--ink);color:var(--bg);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--surface-2);color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

/* pages */
.page{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:8px}
.page>*{min-width:0}
.page h2{font-size:22px;margin-top:6px}
.lead{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0}
.panel h3{font-size:16px}
.panel p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;white-space:nowrap}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.callout{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--sun-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.ok{background:var(--ok-soft)}
.callout b{display:block;margin-bottom:2px}

/* course */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day header{display:flex;align-items:baseline;gap:10px;padding:12px 14px;background:var(--surface-2)}
.day header b{font-size:17px}
.day header span{color:var(--muted);font-size:13px}
.slot{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.slot time{font-weight:700;color:var(--accent);font-size:13.5px}
.slot .plink{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* fx calc */
.fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fx input{font-size:16px!important;padding:9px 8px!important}
.fx label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.fx input{font:inherit;font-size:18px;font-weight:700;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px}
.sheet .bar button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.sheet .bar .t{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo{border-radius:var(--r);background:linear-gradient(135deg,var(--surface-2),var(--accent-soft));aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:13.5px}
.photo b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.dhead{display:grid;gap:4px}
.dhead h2{font-size:24px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.src{font-size:11.5px;color:var(--muted)}

/* driver card */
.driver{position:fixed;inset:0;z-index:50;background:#FFFFFF;color:#0B0B0B;display:grid;align-content:center;gap:18px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.driver p{margin:0}
.driver .big{font-size:clamp(28px,8vw,44px);font-weight:700;line-height:1.2}
.driver .mid{font-size:clamp(18px,5vw,24px)}
.driver .ko2{font-size:14px;color:#555}
.driver button{justify-self:center;border:0;background:#0B0B0B;color:#fff;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:700}


/* phrase rows (larger text + speak) */
.plist.phl{gap:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.prow:last-child{border-bottom:0}
.plist .prow button.ptxt{display:grid;grid-template-columns:none;gap:3px;border:0;padding:2px 0;background:none;text-align:left;color:inherit;min-width:0}
.ptxt .pko{font-size:17.5px;font-weight:700;line-height:1.35;color:var(--ink)}
.ptxt .pen{font-size:15.5px;line-height:1.4;color:var(--ink);opacity:.86}
.ptxt .ppr{font-size:15px;line-height:1.4;color:var(--accent);font-weight:600}
.ptxt .pbig{font-size:12px;color:var(--muted)}
.plist .prow button.say,.saybig .say{display:grid;grid-template-columns:none;justify-items:center;align-content:center;gap:2px;width:54px;min-height:54px;padding:5px 0;border-radius:14px;border:1px solid #0B5FD6;background:#0B5FD6;color:#fff;font-size:13px;font-weight:700}
.prow .say.on,.saybig .say.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.driver .saybig{display:flex;gap:12px;justify-content:center}
.driver .saybig .say{width:auto;min-width:132px;min-height:56px;grid-template-columns:auto auto;gap:8px;padding:0 18px;font-size:17px;background:#0B5FD6;border-color:#0B5FD6;color:#fff}
.driver .saybig .say.alt{background:#fff;color:#0B5FD6}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:#111;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;text-align:center}

.tbl tr.bgrp th{text-align:left;font-size:13px;font-weight:700;color:var(--accent);padding:14px 2px 6px;border-bottom:1px solid var(--line);background:none}
.tbl tr.bgrp:first-child th{padding-top:2px}
.ppg{display:grid;grid-template-columns:auto 1fr auto auto;column-gap:10px;row-gap:4px;align-items:baseline;margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.ppg .pl{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:1.6}
.ppg .pv{font-size:15px;color:var(--ink);text-align:right}
.ppg .pw{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}
.ppg .pd{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.ppg .tot{font-weight:700}
@media (max-width:380px){.ppg{grid-template-columns:auto 1fr auto;column-gap:8px;padding:8px}.ppg .pd{display:none}}.ppg .pv.tot{font-size:17px}.ppg .pw.tot{color:var(--ink);font-size:15px}
.tbl td.r .src{display:block}
.quick.q5{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.quick.q5 button{padding:10px 1px;font-size:11.5px;letter-spacing:-.03em}
@media (max-width:360px){.quick.q5 button{font-size:10.5px}.quick.q5 svg{width:20px;height:20px}}
.wxmore{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);text-align:left;font-size:14px}
.wxmore small{color:var(--muted);font-size:12.5px}.wxmore .w{color:var(--accent);font-weight:700;white-space:nowrap;font-size:13px}
.wxtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:4px 0 12px}
.wxtabs button{display:grid;justify-items:center;gap:1px;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:12px}
.wxtabs button b{font-size:20px}.wxtabs button small{color:var(--muted)}
.wxtabs button[aria-selected="true"]{background:#0B5FD6;border-color:#0B5FD6;color:#fff}.wxtabs button[aria-selected="true"] small{color:#fff}
.bplan .bpick{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#0B5FD6 16%,transparent);border:1px solid color-mix(in srgb,#0B5FD6 45%,transparent);margin-bottom:8px}
.bplan .bpick b{font-size:22px}.bplan .bpick span{font-size:14px}
.tides{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:8px}
.tides>div{display:grid;gap:1px;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.tides>div b{font-size:22px}.tides small{font-size:12px;color:var(--muted)}
.tides .hi b{color:var(--accent)}
svg.tide{width:100%;height:auto;display:block}
svg.tide .tday{fill:color-mix(in srgb,#F5B300 12%,transparent)}
svg.tide .tfill{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
svg.tide .tline{fill:none;stroke:var(--accent);stroke-width:2.5}
svg.tide .thi{fill:var(--accent)}svg.tide .tlo{fill:var(--muted)}
svg.tide .tlab{font-size:11px;fill:var(--ink);font-weight:700}svg.tide .tax{font-size:10px;fill:var(--muted)}
svg.tide .tnow{stroke:#E5484D;stroke-width:2;stroke-dasharray:3 3}
.wxtbl{width:100%;font-size:14px}.wxtbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left}
.wxtbl td,.wxtbl th{padding:7px 4px;white-space:nowrap}
