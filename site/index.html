<title>보라카이 가족 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 의도적으로 라이트 테마 하나만 사용 (휴대폰 다크 모드여도 밝은 화면 유지). Layout: 지도가 주인공인 한 손 조작 앱. 상단 인원·필터 → 지도 카드 → 가로 장소 카드 → 호텔 복귀 패널, 하단 탭. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E9EFEE; --ink:#10292C; --muted:#5A6E71; --line:#D9E3E2;
  --accent:#0B7A83; --accent-soft:#D7EEEF; --on-accent:#FFFFFF; --sun:#E38B1F; --sun-soft:#FCEBD3;
  --warn:#B24A22; --warn-soft:#F8E1D6; --ok:#2C7A4B; --ok-soft:#DCEFE3;
  --sea:#A8DADF; --land:#F0EDE5; --sand:#F5E5BE; --green:#D3E5C9; --pool:#86CFE3; --road:#FFFFFF; --casing:#D3CDBF; --path:#C2B79F; --label:#3E5457; --halo:rgba(255,255,255,.9);
  --c-restaurant:#CF5530; --c-cafe:#8B5A34; --c-convenience:#2A77B8; --c-pharmacy:#2A9258; --c-pub:#7448AE; --follow:#6A3FD0; --follow-soft:#ECE5FB; --c-money:#0E8A6E; --c-fruit:#D9A400;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light; --r:16px; --shadow:0 1px 2px rgba(16,41,44,.06),0 6px 20px rgba(16,41,44,.08);
}



:root.dark{
  /* 아이폰 다크 모드 톤: 차가운 무채색 + 파란 포인트, 카드와 배경 구분을 또렷하게 */
  --bg:#0B0C0E; --surface:#1A1C20; --surface-2:#26292E; --ink:#F2F3F5; --muted:#A8ACB3; --line:#33363C;
  --accent:#5EA2FF; --accent-soft:#16283F; --on-accent:#08162B; --sun:#F2A646; --sun-soft:#352B1A;
  --warn:#FF8A70; --warn-soft:#3A1F1A; --ok:#5FD08A; --ok-soft:#15301F;
  --sea:#0E2A36; --land:#1E2124; --sand:#3A3527; --green:#1F2B25; --pool:#1D5166; --road:#3A3E44; --casing:#0B0C0E; --path:#55524A; --label:#CDD2D8; --halo:rgba(11,12,14,.88);
  --c-restaurant:#FF8A5C; --c-cafe:#D19A6A; --c-convenience:#62A8FF; --c-pharmacy:#5FD08A; --c-pub:#B794F4; --follow:#B794F4; --follow-soft:#2A2440; --c-money:#4FD1B0; --c-fruit:#F4C752;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.45); color-scheme:dark }
:root.dark .panel,:root.dark .vc,:root.dark .chat,:root.dark .day,:root.dark details.fold{border-color:var(--line);box-shadow:var(--shadow)}
:root.dark .pin-notice{background:#3D2A23;border-color:#D97757}
:root.dark .pin-notice b{color:#F0A58A}
:root.dark .pin-notice .next{background:var(--surface)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:720px;margin:0 auto}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.party{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
.party label{font-size:13px;color:var(--muted);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:1}
.seg button{border:0;background:transparent;border-radius:10px;height:34px;font-weight:500;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

/* map */
.mapbox{position:relative;height:clamp(240px,37vh,500px);border-radius:20px;overflow:hidden;background:var(--sea);box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:0;background:none;transform:translate(-50%,-100%)}
.pin .b{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--pc);border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s,opacity .15s}
.pin svg{transform:rotate(45deg);width:15px;height:15px;color:#fff}
.pin.dim{opacity:.28}
.pin.dim .b{transform:rotate(-45deg) scale(.7)}
.pin.sel{z-index:3}
.pin.sel .b{transform:rotate(-45deg) scale(1.3);border-color:var(--ink)}
.pin .t{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-size:11.5px;font-weight:700;background:var(--surface);color:var(--ink);padding:1px 6px;border-radius:6px;box-shadow:var(--shadow);display:none}
.pin.sel .t{display:block}
.pin.h24 .b::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.hotelpin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;border:0;background:none;padding:0;z-index:4}
.hotelpin .b{display:flex;align-items:center;gap:5px;background:var(--sun);color:#1c1204;font-weight:700;font-size:12.5px;padding:5px 9px 5px 6px;border-radius:999px;border:2px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap}
.hotelpin svg{width:16px;height:16px}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:5}
.mapctl button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;font-weight:500}
.mapctl svg{width:20px;height:20px}
.attrib{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--label);background:var(--halo);padding:1px 5px;border-radius:4px;z-index:5}
.legend{position:absolute;left:8px;top:8px;font-size:11px;background:var(--halo);padding:3px 7px;border-radius:8px;z-index:5;color:var(--label)}

/* cards */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.sec-h h2{font-size:16px}
.sec-h span{font-size:12.5px;color:var(--muted)}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-4px;padding:2px 4px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 min(78%,300px);scroll-snap-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;text-align:left;display:grid;gap:6px;align-content:start}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card .k{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.card h3{font-size:16.5px;font-weight:700}
.card .ko{font-size:13px;color:var(--muted);margin-top:-4px}
.card .cost{font-size:15px;font-weight:700;line-height:1.3}
.card .cost small{font-weight:400;color:var(--muted);font-size:12.5px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:7px;margin-top:2px}
.card .more{border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:9px;padding:5px 10px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.sun{background:var(--sun-soft);color:var(--sun)}
.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;background:var(--surface);border-radius:var(--r);flex:1}

/* return panel */
.ret{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:10px;border:1px solid var(--line)}
.ret h3{font-size:15.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ret h3 .arrow{color:var(--sun)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:grid;gap:2px}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-size:18px}
.mode span{font-size:12.5px;color:var(--muted)}
.fare{display:grid;gap:4px;font-size:13.5px;background:var(--bg);border-radius:12px;padding:10px}
.fare div{display:flex;justify-content:space-between;gap:8px}
.fare .lbl{color:var(--muted)}
.rec{font-size:14px;font-weight:500}
.fine{font-size:12px;color:var(--muted);line-height:1.45}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--ink);color:var(--bg);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--surface-2);color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

/* pages */
.page{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:8px}
.page>*{min-width:0}
.page h2{font-size:22px;margin-top:6px}
.lead{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0}
.panel h3{font-size:16px}
.panel p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;white-space:nowrap}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.callout{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--sun-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.ok{background:var(--ok-soft)}
.callout b{display:block;margin-bottom:2px}

/* course */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day header{display:flex;align-items:baseline;gap:10px;padding:12px 14px;background:var(--surface-2)}
.day header b{font-size:17px}
.day header span{color:var(--muted);font-size:13px}
.slot{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.slot time{font-weight:700;color:var(--accent);font-size:13.5px}
.slot .plink{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* fx calc */
.fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fx input{font-size:16px!important;padding:9px 8px!important}
.fx label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.fx input{font:inherit;font-size:18px;font-weight:700;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px}
.sheet .bar button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.sheet .bar .t{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo{border-radius:var(--r);background:linear-gradient(135deg,var(--surface-2),var(--accent-soft));aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:13.5px}
.photo b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.dhead{display:grid;gap:4px}
.dhead h2{font-size:24px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.src{font-size:11.5px;color:var(--muted)}

/* driver card */
.driver{position:fixed;inset:0;z-index:50;background:#FFFFFF;color:#0B0B0B;display:grid;align-content:center;gap:18px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.driver p{margin:0}
.driver .big{font-size:clamp(28px,8vw,44px);font-weight:700;line-height:1.2}
.driver .mid{font-size:clamp(18px,5vw,24px)}
.driver .ko2{font-size:14px;color:#555}
.driver button{justify-self:center;border:0;background:#0B0B0B;color:#fff;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:700}


/* phrase rows (larger text + speak) */
.plist.phl{gap:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.prow:last-child{border-bottom:0}
.plist .prow button.ptxt{display:grid;grid-template-columns:none;gap:3px;border:0;padding:2px 0;background:none;text-align:left;color:inherit;min-width:0}
.ptxt .pko{font-size:17.5px;font-weight:700;line-height:1.35;color:var(--ink)}
.ptxt .pen{font-size:15.5px;line-height:1.4;color:var(--ink);opacity:.86}
.ptxt .ppr{font-size:15px;line-height:1.4;color:var(--accent);font-weight:600}
.ptxt .pbig{font-size:12px;color:var(--muted)}
.plist .prow button.say,.saybig .say{display:grid;grid-template-columns:none;justify-items:center;align-content:center;gap:2px;width:54px;min-height:54px;padding:5px 0;border-radius:14px;border:1px solid #0B5FD6;background:#0B5FD6;color:#fff;font-size:13px;font-weight:700}
.prow .say.on,.saybig .say.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.driver .saybig{display:flex;gap:12px;justify-content:center}
.driver .saybig .say{width:auto;min-width:132px;min-height:56px;grid-template-columns:auto auto;gap:8px;padding:0 18px;font-size:17px;background:#0B5FD6;border-color:#0B5FD6;color:#fff}
.driver .saybig .say.alt{background:#fff;color:#0B5FD6}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:#111;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;text-align:center}

.tbl tr.bgrp th{text-align:left;font-size:13px;font-weight:700;color:var(--accent);padding:14px 2px 6px;border-bottom:1px solid var(--line);background:none}
.tbl tr.bgrp:first-child th{padding-top:2px}
.ppg{display:grid;grid-template-columns:auto 1fr auto auto;column-gap:10px;row-gap:4px;align-items:baseline;margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.ppg .pl{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:1.6}
.ppg .pv{font-size:15px;color:var(--ink);text-align:right}
.ppg .pw{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}
.ppg .pd{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.ppg .tot{font-weight:700}
@media (max-width:380px){.ppg{grid-template-columns:auto 1fr auto;column-gap:8px;padding:8px}.ppg .pd{display:none}}.ppg .pv.tot{font-size:17px}.ppg .pw.tot{color:var(--ink);font-size:15px}
.tbl td.r .src{display:block}
.quick.q5{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.quick.q5 button{padding:10px 1px;font-size:11.5px;letter-spacing:-.03em}
@media (max-width:360px){.quick.q5 button{font-size:10.5px}.quick.q5 svg{width:20px;height:20px}}
.wxmore{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);text-align:left;font-size:14px}
.wxmore small{color:var(--muted);font-size:12.5px}.wxmore .w{color:var(--accent);font-weight:700;white-space:nowrap;font-size:13px}
.wxtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:4px 0 12px}
.wxtabs button{display:grid;justify-items:center;gap:1px;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:12px}
.wxtabs button b{font-size:20px}.wxtabs button small{color:var(--muted)}
.wxtabs button[aria-selected="true"]{background:#0B5FD6;border-color:#0B5FD6;color:#fff}.wxtabs button[aria-selected="true"] small{color:#fff}
.bplan .bpick{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#0B5FD6 16%,transparent);border:1px solid color-mix(in srgb,#0B5FD6 45%,transparent);margin-bottom:8px}
.bplan .bpick b{font-size:22px}.bplan .bpick span{font-size:14px}
.tides{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:8px}
.tides>div{display:grid;gap:1px;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.tides>div b{font-size:22px}.tides small{font-size:12px;color:var(--muted)}
.tides .hi b{color:var(--accent)}
svg.tide{width:100%;height:auto;display:block}
svg.tide .tday{fill:color-mix(in srgb,#F5B300 12%,transparent)}
svg.tide .tfill{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
svg.tide .tline{fill:none;stroke:var(--accent);stroke-width:2.5}
svg.tide .thi{fill:var(--accent)}svg.tide .tlo{fill:var(--muted)}
svg.tide .tlab{font-size:11px;fill:var(--ink);font-weight:700}svg.tide .tax{font-size:10px;fill:var(--muted)}
svg.tide .tnow{stroke:#E5484D;stroke-width:2;stroke-dasharray:3 3}
.wxtbl{width:100%;font-size:14px}.wxtbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left}
.wxtbl td,.wxtbl th{padding:7px 4px;white-space:nowrap}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(7,1fr)}

.pickbar{position:absolute;left:8px;right:56px;top:8px;z-index:7;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:grid;gap:8px;font-size:14px;box-shadow:var(--shadow)}

.chat>header .live{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chat>header .live i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chat>header .live.on i{background:var(--ok)}
.chat .tiny{border:0;background:var(--surface-2);border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:500}

/* ================= routing graph ================= */
function buildGraph(g){
  const xy=g.xy, N=xy.length/2, e=g.e, deg=new Int32Array(N+1);
  for(let i=0;i<e.length;i+=3){deg[e[i]]++;deg[e[i+1]]++;}
  const start=new Int32Array(N+1); for(let i=0;i<N;i++) start[i+1]=start[i]+deg[i];
  const fill=start.slice(0,N), to=new Int32Array(start[N]), w=new Float32Array(start[N]), tk=new Uint8Array(start[N]), tnode=new Uint8Array(N);
  for(let i=0;i<e.length;i+=3){const a=e[i],b=e[i+1],t=e[i+2],d=Math.hypot(xy[2*a]-xy[2*b],xy[2*a+1]-xy[2*b+1]);
    to[fill[a]]=b;w[fill[a]]=d;tk[fill[a]++]=t; to[fill[b]]=a;w[fill[b]]=d;tk[fill[b]++]=t; if(t){tnode[a]=1;tnode[b]=1;}}
  return {N,xy,start,to,w,tk,tnode,entry:g.entry};
}
function dijkstra(src,trike){
  const {N,start,to,w,tk}=G, dist=new Float64Array(N).fill(Infinity), prev=new Int32Array(N).fill(-1);
  const hk=[],hv=[]; const push=(k,v)=>{let i=hk.length;hk.push(k);hv.push(v);while(i>0){const p=(i-1)>>1;if(hk[p]<=hk[i])break;[hk[p],hk[i]]=[hk[i],hk[p]];[hv[p],hv[i]]=[hv[i],hv[p]];i=p;}};
  const pop=()=>{const v=hv[0],k=hk[0],lk=hk.pop(),lv=hv.pop();if(hk.length){hk[0]=lk;hv[0]=lv;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<hk.length&&hk[l]<hk[m])m=l;if(r<hk.length&&hk[r]<hk[m])m=r;if(m===i)break;[hk[m],hk[i]]=[hk[i],hk[m]];[hv[m],hv[i]]=[hv[i],hv[m]];i=m;}}return [k,v]};
  dist[src]=0; push(0,src);
  while(hk.length){const [d,u]=pop(); if(d>dist[u]) continue;
    for(let j=start[u];j<start[u+1];j++){ if(trike&&!tk[j]) continue; const v=to[j],nd=d+w[j]; if(nd<dist[v]){dist[v]=nd;prev[v]=u;push(nd,v);} } }
  return {dist,prev};
}
function nearest(x,y,trike){
  const {N,xy,tnode}=G; let best=-1,bd=Infinity;
  for(let i=0;i<N;i++){ if(trike&&!tnode[i]) continue; const d=(xy[2*i]-x)**2+(xy[2*i+1]-y)**2; if(d<bd){bd=d;best=i;} }
  return [best,Math.sqrt(bd)];
}
function pathPts(prev,from,x0,y0,x1,y1){ // from node back to tree root
  const pts=[x0,y0]; let u=from; let guard=0; while(u!==-1&&guard++<1e5){pts.push(G.xy[2*u],G.xy[2*u+1]); u=prev[u];} if(x1!=null) pts.push(x1,y1); return pts;
}
let HW=null, HT=null;
function routeToHotel(x,y){
  const r={air:Math.round(Math.hypot(x,y))};
  for(const [k,tree,trike,mpm,minM] of [["walk",HW,false,WALK_MPM,1],["trike",HT,true,TRIKE_MPM,2]]){
    const [n,off]=nearest(x,y,trike); const L=tree.dist[n]+off;
    r[k]={m:Math.round(L),min:Math.max(minM,Math.round(L/mpm)),p:pathPts(tree.prev,n,x,y)};
  }
  return r;
}
function routeBetween(a,b){ // a → b
  const out={};
  for(const [k,trike,mpm,minM] of [["walk",false,WALK_MPM,1],["trike",true,TRIKE_MPM,2]]){
    const [nb,ob]=nearest(b.x,b.y,trike), [na,oa]=nearest(a.x,a.y,trike);
    const t=dijkstra(nb,trike); const L=t.dist[na]+oa+ob;
    if(!isFinite(L)){out[k]=null;continue}
    out[k]={m:Math.round(L),min:Math.max(minM,Math.round(L/mpm)),p:pathPts(t.prev,na,a.x,a.y,b.x,b.y)};
  }
  return out;
}

const php=v=>(v<-0.5?"−":"")+"₱"+Math.abs(Math.round(v)).toLocaleString("en-US");
const krw=v=>{ const w=Math.round(v*D.fx.krw_per_php/100)*100; return (w<0?"−":"")+"₩"+Math.abs(w).toLocaleString("ko-KR"); };
function rng(a,b,f){return a===b?f(a):f(a)+"–"+f(b).replace(/^[₱₩]/,"")}
function priceOf(m){return m==null?null:Array.isArray(m)?m:[m,m]}
function groupCost(p,n){ if(!p.pp) return null; const k=n*(p.sc?1+p.sc:1); return [p.pp[0]*k,p.pp[1]*k]; }
function trikes(n){return Math.ceil(n/TRIKE.cap)}
function chargeNote(p){
  const v=p.vat===true?"VAT 포함":p.vat===false?"VAT 별도":"VAT 표기 미확인";
  const s=p.sc?"서비스차지 "+Math.round(p.sc*100)+"% 별도(합계에 반영)":p.sc===0?"서비스차지 없음":"서비스차지 미확인";
  return v+" · "+s;
}
function nearLabel(x,y){
  let best=null,bd=1e9;
  D.landmarks.concat(D.places).forEach(p=>{const d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;best=p;}});
  if(Math.hypot(x,y)<90) return "헤난 가든";
  if(best&&bd<150) return (best.ko||best.name).replace(/ \(.+\)$/,"")+" 근처";
  return "호텔에서 "+Math.round(Math.hypot(x,y)/10)*10+"m";
}

function shrink(file,max){
  return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.85); };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("decode"))}; img.src=u; });
}

function bindFxCalc(){

    if(mode==="php"){ m.textContent=won(x*fx.krw_per_php); sub.textContent=x?"≈ "+usd(x/FXC):""; }
    if(mode==="krw"){ const p=x/fx.krw_per_php; m.textContent=n0(p); sub.textContent=x?"≈ "+usd(p/FXC):""; }
    if(mode==="usd"){ const p=x*FXC; m.textContent=n0(p); sub.textContent=x?"≈ ₩"+won(p*fx.krw_per_php):""; }
    document.querySelectorAll("#fx-chips [data-fxv]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.fxv===x)); };

  inp.addEventListener("input",draw); inp.addEventListener("focus",()=>inp.select());

}

function route(){

  if(h.startsWith("p-")){ if(!$("#app").children.length||$("#boot")) renderHome(); openPlace(h.slice(2)); return; }
  closeSheet();
  if(h==="prices") h="info";
  const tab=["home","eat","map","course","info","ledger","talk"].includes(h)?h:"home";
  if(tab==="map"){ if(!$("#cv")) renderMapTab(); else MAP.resize(); }
  else { MAP=null; S.pick=null; ({home:renderHome,eat:renderEat,course:renderCourse,info:renderInfo,ledger:renderLedger,talk:renderTalk})[tab](); window.scrollTo(0,0); }
  setNav(tab); updateUnread();
}

const TRIP_START=Date.UTC(2026,10,23,16,0); // 2026-11-24 00:00 Manila
function manilaDay(){ const d=Math.floor((Date.now()-TRIP_START)/86400000); return d; } // 0 = 11/24
function clockText(){ const f=(off)=>{ const d=new Date(Date.now()+off*3600e3); return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0"); };
  return '<span>🇵🇭 필리핀 <b>'+f(8)+'</b></span><span>🇰🇷 한국 <b>'+f(9)+'</b></span><span class="fine">한국이 1시간 빨라요</span>'; }
setInterval(()=>{ const c=document.getElementById("clock"); if(c) c.innerHTML=clockText(); },30000);
function upNextHTML(day,label){
  const rows=day.items.filter(it=>it[0]!=="tip"&&it[0]!=="memo").slice(0,6).map(it=>slotHTML(day,it,false)).join("");
  const tip=day.items.find(it=>it[0]==="tip");
  return '<section class="day"><header><b class="num">'+day.d+' ('+day.w+')</b><span>'+label+'</span><a href="#course" class="more-l">전체 일정 →</a></header>'+dayWx(day)+rows+(tip?slotHTML(day,tip,false):'')+'</section>';
}

const ECATS=[["all","전체"],["meal","식사"],["cafe","카페·디저트"],["korean","한식"],["bar","바"],["fruit","과일"]];
const EFILS=[["open","지금 영업 중"],["krpop","한국인 인기"],["mine","❤️ 내 찜"],["fam","가족 찜"]];

const SORTS=[["claude","추천순"],["kr","한국인 추천순"],["rating","전체 평점순"],["likes","찜순"],["dist","거리순"],["price","가격순"]];
function eMatch(p,c){ if(!isFood(p)||/Talipapa Bukid/.test(p.name)) return false;
  return c==="all"||(c==="mine"&&iLike(p.id))||(c==="fam"&&likeCount(p.id)>0)||(c==="open"&&isOpen(p))||(c==="fruit"&&p.cat==="fruit")||(c==="meal"&&p.cat==="restaurant")||(c==="cafe"&&(p.cat==="cafe"||p.cat==="dessert"))||(c==="bar"&&(p.cat==="bar"||p.cat==="pub"))||
    (c==="korean"&&/한식|한국|korean/i.test((p.cuisine||"")+p.name+(p.ko||"")))||(c==="krpop"&&(p.krPop||0)>=2)||(c==="menu"&&p.hasMenu); }
function claudeScore(p){
  const r=[]; let s=0;
  if(p.krPop){ s+=p.krPop*2.2; r.push(p.krPop>=3?"한국인 후기 많음":p.krPop>=2?"한국인 후기 있음":"한국인 후기 조금"); }
  if(p.rating&&p.rating.score){ s+=(p.rating.score-4)*4; r.push("★"+p.rating.score); }
  if(p.placeId){ s+=1; r.push("직접 조사"); }
  if(p.hasMenu){ s+=0.6; }
  if(S.n>=5&&p.groupFit===3){ s+=1; r.push(S.n+"명 자리 OK"); } if(S.n>=5&&p.groupFit===1) s-=1.5;
  if(p.route){ s-=p.route.walk.min/8; if(p.route.walk.min<=8) r.push("도보 "+p.route.walk.min+"분"); } else s-=1.5;
  if(p.pp&&p.pp[1]<=400){ s+=0.4; r.push("저렴"); }
  return {s,r};
}
/* 리뷰 수까지 반영한 평점 (리뷰가 적으면 4.0 쪽으로 당겨서 계산 — 리뷰 3개짜리 5.0이 1위가 되지 않게) */
function wRating(p){ const r=p.rating; if(!r) return 0; const n=+(r.count||0), m=80, C=4.0; return (n*r.score+m*C)/(n+m); }
function rankVenues(list,sort){
  const big=1e9;
  const key={claude:p=>-claudeScore(p).s, rating:p=>p.rating?-wRating(p):big, kr:p=>-((p.krPop||0)*100+(p.rating?wRating(p)*10:0)),
    dist:p=>p.route?p.route.walk.m:big, price:p=>p.pp?p.pp[0]:big, likes:p=>-(likeCount(p.id)*1000)-claudeScore(p).s}[sort];
  return list.slice().sort((a,b)=>key(a)-key(b));
}
function shortSite(s){ s=String(s||""); return /trip ?advisor/i.test(s)?"트립어드바이저":/google/i.test(s)?"구글":/trip\.com/i.test(s)?"Trip.com":/guru/i.test(s)?"레스토랑구루":s.slice(0,12); }
function dname(p){ return p.name.replace(/\s*\([^)]*\)/g,"").replace(/\s+-\s+.*$/,"").trim()||p.name; }
function venueCard(p,rank){
  const gc=groupCost(p,S.n), cs=claudeScore(p), cv=coverOf(p);
  const rating=p.rating?'<span class="stars">★ '+p.rating.score+'</span>'+(p.rating.count?'<span class="rc">('+Number(p.rating.count).toLocaleString()+(p.rating.site?' · '+esc(shortSite(p.rating.site)):'')+')</span>':''):'<span class="rc">평점 없음</span>';
  const pop=p.krPop>=3?'<span class="badge ok">🇰🇷 한국인 추천 많음</span>':p.krPop===2?'<span class="badge">🇰🇷 한국인 추천</span>':'';
  const rv=p.krReview||p.desc||"";
  return '<article class="vc vr" style="--pc:'+colorOf(p.cat)+'">'+
    '<button type="button" class="th'+(cv?'':' ph')+'" data-open="'+esc(p.id)+'" aria-label="'+esc(dname(p))+' 자세히">'+(cv?'<img src="'+esc(cv.src)+'" alt="" loading="lazy">'+(cv.rep?'<i>대표</i>':cv.fam?'<i>가족 사진</i>':''):iconOf(p.cat))+'</button>'+
    '<div class="vb"><h3 class="tt"><button type="button" data-open="'+esc(p.id)+'"><span class="rank num">'+(rank||"")+'</span>'+esc(dname(p))+'</button></h3>'+
      '<div class="meta"><span>'+esc(catText(p))+'</span>'+rating+'<span class="num">'+(p.route?'도보 '+p.route.walk.min+'분':'위치 미확인')+'</span></div>'+
      '<div class="meta">'+openBadge(p)+pop+'</div>'+
      (gc?'<div class="money num">1인 '+rng(p.pp[0],p.pp[1],php)+' <small>· '+S.n+'명 '+rng(gc[0],gc[1],php)+'</small></div>':'<div class="money"><small>가격 정보 없음</small></div>')+
    '</div>'+
    (rv?'<p class="rv2">'+(p.krReview?'<b>한국인 후기</b> ':'')+esc(rv)+'</p>':'')+

    '<div class="acts2"><span class="likebox" data-likebox="'+esc(p.id)+'">'+likeBtn(p)+'</span><span class="sp"></span>'+
      '<button type="button" class="mini" data-open="'+esc(p.id)+'">'+(p.hasMenu?'메뉴판':'자세히')+'</button>'+(p.route?'<button type="button" class="mini alt" data-onmap="'+esc(p.id)+'">길찾기</button>':'')+'</div></article>';
}

function loadMenus(){ if(!MENUP) MENUP=fetch("menus.json").then(r=>r.json()).then(j=>{MENUS=j.menus; GLOSS=j.gloss; DISHP=j.dishPhotos||{}; DKEYS=Object.keys(DISHP).sort((a,b)=>b.length-a.length); return MENUS;}).catch(()=>{MENUS={};return MENUS;}); return MENUP; }
let GLOSS={};
function allItems(id){ const m=MENUS&&MENUS[id]; if(!m) return []; return [].concat(m.curated||[],m.gpt||[],m.kr||[],m.delivery||[]).filter(x=>x&&x.n); }
function dishHits(id,q){ if(!MENUS) return [];
  const kw=[q]; for(const k in GLOSS) if(GLOSS[k].includes(q)) kw.push(k);
  return allItems(id).filter(x=>typeof x.php==="number"&&x.php>0&&kw.some(k=>(x.n+" "+(x.ko||"")).toLowerCase().includes(k))); }
function glossHTML(name){ const n=(name||"").toLowerCase(); const out=[]; for(const k in GLOSS){ if(out.length>=2) break; if(k.length>3&&n.includes(k)) out.push(GLOSS[k]); } return out.map(g=>'<span class="gl">'+esc(g)+'</span>').join(""); }

function manilaNow(){ const d=new Date(Date.now()+8*3600e3); return {day:(d.getUTCDay()+6)%7, min:d.getUTCHours()*60+d.getUTCMinutes()}; }
const fmtM=m=>{m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
function openState(p){
  const H=p.H; if(!H||!H.w) return {s:"unknown",t:"영업시간 미확인"};
  const {day,min}=manilaNow(), w=H.w, today=w[day]||[], yest=w[(day+6)%7]||[];
  const tail=H.conflict?" · 출처마다 다름":H.delivery?" · 배달 기준":"";
  if(today.length===1&&today[0][0]===0&&today[0][1]>=1440) return {s:"open",t:"24시간 영업"+tail};
  for(const [o,c] of yest) if(c>1440&&min<c-1440) return c-1440-min<=45?{s:"soon",t:"곧 마감 · "+fmtM(c)+tail}:{s:"open",t:"영업 중 · "+fmtM(c)+" 마감"+tail};
  for(const [o,c] of today) if(o<=min&&min<c) return c-min<=45?{s:"soon",t:"곧 마감 · "+fmtM(c)+tail}:{s:"open",t:"영업 중 · "+fmtM(c)+" 마감"+tail};
  const next=today.find(([o])=>o>min); if(next) return {s:"closed",t:"영업 전 · "+fmtM(next[0])+" 오픈"+tail};
  if(!today.length) return {s:"closed",t:"오늘 휴무"+tail};
  const tm=w[(day+1)%7]||[]; return {s:"closed",t:"영업 종료"+(tm.length?" · 내일 "+fmtM(tm[0][0])+" 오픈":"")+tail};
}

function parseQuick(raw){
  const t=(raw||"").trim(); if(!t) return null;
  const num=s=>parseFloat(String(s).replace(/,/g,""));
  const amts=[]; const re=/(₱|\$|₩)?\s*(\d[\d,]*(?:\.\d+)?)\s*(만\s*원|만원|페소|php|p\b|달러|불|usd|원|krw)?/gi; let m;
  while((m=re.exec(t))){ const pre=m[1]||"", unit=(m[3]||"").toLowerCase().replace(/\s/g,""); let cur=null, v=num(m[2]);
    if(pre==="₱"||/페소|php|^p$/.test(unit)) cur="PHP"; else if(pre==="$"||/달러|불|usd/.test(unit)) cur="USD"; else if(pre==="₩"||/원|krw/.test(unit)) { cur="KRW"; if(/만/.test(unit)) v*=10000; }
    const after=t.slice(m.index+m[0].length,m.index+m[0].length+3);
    const isQty=!cur&&/^\s*(개|잔|병|그릇|인분|명|장|박|대|번|시)/.test(after);
    amts.push({v,cur,isQty,raw:m[0],qtyWord:isQty}); }
  const isFx=/환전/.test(t)&&amts.some(a=>a.cur==="USD")&&amts.some(a=>a.cur==="PHP");
  if(isFx){ return {fx:true,usd:amts.find(a=>a.cur==="USD").v,php:amts.find(a=>a.cur==="PHP").v,where:t.replace(/\$?\s*\d[\d,.]*\s*(달러|불|usd|페소|php)?|₱\s*\d[\d,.]*|환전(했음|함|했어요)?/gi," ").replace(/\s+/g," ").trim()}; }
  const money=amts.filter(a=>a.cur)[0]||amts.filter(a=>!a.isQty).sort((a,b)=>b.v-a.v)[0];
  if(!money||!(money.v>0)) return {err:"금액을 찾지 못했어요. 예: 점심 지보스 2,350페소"};
  const q=amts.find(a=>a.isQty&&a!==money); const qty=q?Math.max(1,Math.round(q.v)):1;
  const cur=money.cur||"PHP";
  const p=cur==="PHP"?money.v:cur==="USD"?money.v*D.fx.php_per_usd:money.v/D.fx.krw_per_php;
  let cat=(QCAT.find(([c,r])=>r.test(t))||["팁·기타"])[0]; if(cat==="식사") cat=mealByTime();
  const mm=QMENU.find(([r])=>r.test(t)); const menu=mm?menuKeyByName(mm[1]):"";
  const src=/자유경비|내 ?돈|개인/.test(t)?"자유경비":"공금";
  let what=t.replace(money.raw,"").replace(q?q.raw:"","").replace(/(^|\s)(개|잔|병|그릇|인분|장|대|명|박|번)(?=\s|$)/,"$1").replace(/(\S)(개|잔|병|그릇|인분|장|대|명|박|번)(?=\s|$)/,"$1").replace(/(구매|구입|샀음|샀어요|결제|냈음|냈어요|지불|씀|썼음|썼어요|했음|함)\.?$/,"").replace(/(자유경비|내 ?돈|개인)(로|으로)?/,"").replace(/\s+/g," ").trim();
  what=what.replace(/(용으로|용|으로|로)$/,"").trim()||cat;
  return {what,amt:money.v,cur,php:Math.round(p*100)/100,qty,cat,menu,src};
}

        el.addEventListener("click",ev=>{ev.stopPropagation(); if(S.pick){ S.pick={x:o.p.x,y:o.p.y}; renderPick(); return; } openPerson(id);}); pinsEl.appendChild(el); o=avaMap[id]={el,p};}
      o.p=p; o.el.querySelector(".f").textContent=p.char||"🙂"; o.el.style.setProperty("--uc",ucolorOf(id,p.color));
      const n=o.el.querySelector(".n"); n.textContent=(p.nick||"가족")+(id===LIVE.uid?" (나)":"")+" "; const sm=document.createElement("small"); sm.textContent=ago(p.at); n.appendChild(sm);
      o.el.classList.toggle("me",id===LIVE.uid); o.el.classList.toggle("old",Date.now()-p.at>STALE_MS);
      o.el.setAttribute("aria-label",(p.nick||"가족")+" 위치, "+ago(p.at));
    });
    placePins();
  }
  function setRoute(pk,mode){st.route=pk; st.mode=mode; draw();}
  function setTemp(t){st.temp=t; placePins();}
  function fitPts(pts,maxScale){
    let a=1e9,b=1e9,c=-1e9,d=-1e9; pts.concat([[0,0]]).forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)});
    const pad=48, s=Math.min((st.w-pad*2)/Math.max(c-a,60),(st.h-pad*2-30)/Math.max(d-b,60));
    const sc=Math.min(maxScale||1.6,Math.max(0.12,s)); animateTo((a+c)/2,(b+d)/2+10/sc,sc);
  }
  function fitTo(list){ fitPts(list.slice(0,8).map(p=>[p.x,p.y]),1.4); }
  function showPts(flat){ const pts=[]; for(let i=0;i<flat.length;i+=2) pts.push([flat[i],flat[i+1]]); fitPts(pts,1.8); }
  function flyTo(x,y){ animateTo(x,y,Math.max(st.scale,1.1)); }
  function animateTo(cx,cy,sc){
    const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const f={cx:st.cx,cy:st.cy,s:st.scale}, t0=performance.now(), dur=reduce?0:320; cancelAnimationFrame(st.anim);
    (function step(t){const k=dur?Math.min(1,(t-t0)/dur):1, e=1-Math.pow(1-k,3);
      st.cx=f.cx+(cx-f.cx)*e; st.cy=f.cy+(cy-f.cy)*e; st.scale=f.s*Math.pow(sc/f.s,e); draw(); if(k<1) st.anim=requestAnimationFrame(step);})(t0);
  }
  function zoomAt(mx,my,k){ const ns=Math.min(4,Math.max(0.08,st.scale*k)); const X=wx(mx),Y=wy(my); st.scale=ns; st.cx=X-(mx-st.w/2)/st.scale; st.cy=Y-(my-st.h/2)/st.scale; draw(); }
  const pts=new Map(); let last=null, lastTap=0, moved=0;
  box.addEventListener("pointerdown",e=>{ if(e.target.closest(".mapctl,.pickbar,.pin,.dp,.ava,.hotelpin")) return; box.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; cancelAnimationFrame(st.anim); last=null; });
  box.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const r=box.getBoundingClientRect();
    if(pts.size===1){ const dx=e.clientX-prev.x, dy=e.clientY-prev.y; moved+=Math.abs(dx)+Math.abs(dy); st.cx-=dx/st.scale; st.cy-=dy/st.scale; draw(); }
    else if(pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
      if(last){ zoomAt(mx,my,d/last.d); st.cx-=(mx-last.mx)/st.scale; st.cy-=(my-last.my)/st.scale; draw(); } last={d,mx,my}; moved+=10; } });
  const up=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); last=null;
    if(pts.size===0&&moved<6&&e.type==="pointerup"){ const r=box.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
      if(S.pick){ S.pick={x:Math.round(wx(mx)),y:Math.round(wy(my))}; renderPick(); return; }
      const now=Date.now(); if(now-lastTap<300){ zoomAt(mx,my,1.8); lastTap=0;} else lastTap=now; } };
  box.addEventListener("pointerup",up); box.addEventListener("pointercancel",up);
  box.addEventListener("wheel",e=>{ e.preventDefault(); const r=box.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0018)); },{passive:false});
  box.querySelector("#zin").addEventListener("click",()=>animateTo(st.cx,st.cy,Math.min(4,st.scale*1.6)));
  box.querySelector("#zout").addEventListener("click",()=>animateTo(st.cx,st.cy,Math.max(0.08,st.scale/1.6)));
  box.querySelector("#zhome").addEventListener("click",()=>animateTo(0,-60,0.75));
  box.querySelector("#zme").addEventListener("click",()=>{ const m=myLoc(); if(m&&!S.pick) flyTo(m.x,m.y); startPick(); });
  if(window.ResizeObserver) new ResizeObserver(resize).observe(box); else window.addEventListener("resize",resize);
  resize();
  return {setPins,setPeople,setRoute,setTemp,fitTo,showPts,flyTo,resize,draw,_st:st};
}

Promise.all(["data.json","map.json","venues.json"].map(u=>fetch(u).then(r=>{if(!r.ok) throw new Error(u+" "+r.status); return r.json();})).concat([fetch("extra.json").then(r=>r.ok?r.json():{}).catch(()=>({}))])).then(([d,m,v,e])=>{
  EXTRA=e||{};
  D=d; D.map=m; G=buildGraph(m.graph);
  HW=dijkstra(G.entry,false); HT=dijkstra(G.entry,true);
  VEN=v.filter(p=>p.id!=="talipapa"); const have=new Set();
  VEN.forEach(p=>{ p.route=p.x!=null?routeToHotel(p.x,p.y):null; BYID[p.id]=p; const mm=(p.coordSrc||"").match(/OSM (node|way) (\d+)/); if(mm) have.add(mm[1][0]+mm[2]); });
  const others=(d.others||[]).filter(o=>!have.has(o.id.slice(1)));
  others.forEach(p=>{ p.route=routeToHotel(p.x,p.y); BYID[p.id]=p; });
  ALL=VEN.filter(p=>p.route).concat(others);
  D.places=VEN.filter(p=>p.route);
  route(); initLive(); loadWx(); setInterval(loadWx,30*60000);
  setInterval(()=>{ if(MAP&&Object.keys(LIVE.people).length) MAP.setPeople(); },60000);
}).catch(err=>{ $("#app").innerHTML='<div class="loading">데이터를 불러오지 못했어요. 새로고침해 주세요.<br><small>'+esc(err.message)+'</small></div>'; });
})();
