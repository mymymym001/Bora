<title>보라카이 가족 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 지도가 주인공인 한 손 조작 앱. 상단 인원·필터 → 지도 카드 → 가로 장소 카드 → 호텔 복귀 패널, 하단 탭. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E9EFEE; --ink:#10292C; --muted:#5A6E71; --line:#D9E3E2;
  --accent:#0B7A83; --accent-soft:#D7EEEF; --on-accent:#FFFFFF; --sun:#E38B1F; --sun-soft:#FCEBD3;
  --warn:#B24A22; --warn-soft:#F8E1D6; --ok:#2C7A4B; --ok-soft:#DCEFE3;
  --sea:#A8DADF; --land:#F0EDE5; --sand:#F5E5BE; --green:#D3E5C9; --pool:#86CFE3; --road:#FFFFFF; --casing:#D3CDBF; --path:#C2B79F; --label:#3E5457; --halo:rgba(255,255,255,.9);
  --c-restaurant:#CF5530; --c-cafe:#8B5A34; --c-convenience:#2A77B8; --c-pharmacy:#2A9258; --c-pub:#7448AE;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(16,41,44,.06),0 6px 20px rgba(16,41,44,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C181A; --surface:#132326; --surface-2:#1A2E31; --ink:#E3EDED; --muted:#93A8AA; --line:#23383B;
  --accent:#3DB3BB; --accent-soft:#16393C; --on-accent:#06191B; --sun:#F2A646; --sun-soft:#3A2A14;
  --warn:#EE8A62; --warn-soft:#3A2018; --ok:#6CC795; --ok-soft:#173326;
  --sea:#0F3A43; --land:#1A2A2C; --sand:#3A3427; --green:#1E3428; --pool:#1C566A; --road:#3A4D50; --casing:#0E1B1D; --path:#5A5644; --label:#C6D6D7; --halo:rgba(12,24,26,.85);
  --c-restaurant:#F07A52; --c-cafe:#C98C5E; --c-convenience:#5BA5E6; --c-pharmacy:#55C485; --c-pub:#A884DD;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C181A; --surface:#132326; --surface-2:#1A2E31; --ink:#E3EDED; --muted:#93A8AA; --line:#23383B;
  --accent:#3DB3BB; --accent-soft:#16393C; --on-accent:#06191B; --sun:#F2A646; --sun-soft:#3A2A14;
  --warn:#EE8A62; --warn-soft:#3A2018; --ok:#6CC795; --ok-soft:#173326;
  --sea:#0F3A43; --land:#1A2A2C; --sand:#3A3427; --green:#1E3428; --pool:#1C566A; --road:#3A4D50; --casing:#0E1B1D; --path:#5A5644; --label:#C6D6D7; --halo:rgba(12,24,26,.85);
  --c-restaurant:#F07A52; --c-cafe:#C98C5E; --c-convenience:#5BA5E6; --c-pharmacy:#55C485; --c-pub:#A884DD;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:720px;margin:0 auto}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.party{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
.party label{font-size:13px;color:var(--muted);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}
.seg button{border:0;background:transparent;border-radius:10px;height:34px;font-weight:500;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

/* map */
.mapbox{position:relative;height:clamp(240px,37vh,500px);border-radius:20px;overflow:hidden;background:var(--sea);box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:0;background:none;transform:translate(-50%,-100%)}
.pin .b{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--pc);border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s,opacity .15s}
.pin svg{transform:rotate(45deg);width:15px;height:15px;color:#fff}
.pin.dim{opacity:.28}
.pin.dim .b{transform:rotate(-45deg) scale(.7)}
.pin.sel{z-index:3}
.pin.sel .b{transform:rotate(-45deg) scale(1.3);border-color:var(--ink)}
.pin .t{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-size:11.5px;font-weight:700;background:var(--surface);color:var(--ink);padding:1px 6px;border-radius:6px;box-shadow:var(--shadow);display:none}
.pin.sel .t{display:block}
.pin.h24 .b::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.hotelpin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;border:0;background:none;padding:0;z-index:4}
.hotelpin .b{display:flex;align-items:center;gap:5px;background:var(--sun);color:#1c1204;font-weight:700;font-size:12.5px;padding:5px 9px 5px 6px;border-radius:999px;border:2px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap}
.hotelpin svg{width:16px;height:16px}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:5}
.mapctl button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;font-weight:500}
.mapctl svg{width:20px;height:20px}
.attrib{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--label);background:var(--halo);padding:1px 5px;border-radius:4px;z-index:5}
.legend{position:absolute;left:8px;top:8px;font-size:11px;background:var(--halo);padding:3px 7px;border-radius:8px;z-index:5;color:var(--label)}

/* cards */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.sec-h h2{font-size:16px}
.sec-h span{font-size:12.5px;color:var(--muted)}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-4px;padding:2px 4px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 min(78%,300px);scroll-snap-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;text-align:left;display:grid;gap:6px;align-content:start}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card .k{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.card h3{font-size:16.5px;font-weight:700}
.card .ko{font-size:13px;color:var(--muted);margin-top:-4px}
.card .cost{font-size:15px;font-weight:700;line-height:1.3}
.card .cost small{font-weight:400;color:var(--muted);font-size:12.5px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:7px;margin-top:2px}
.card .more{border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:9px;padding:5px 10px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.sun{background:var(--sun-soft);color:var(--sun)}
.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;background:var(--surface);border-radius:var(--r);flex:1}

/* return panel */
.ret{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:10px;border:1px solid var(--line)}
.ret h3{font-size:15.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ret h3 .arrow{color:var(--sun)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:grid;gap:2px}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-size:18px}
.mode span{font-size:12.5px;color:var(--muted)}
.fare{display:grid;gap:4px;font-size:13.5px;background:var(--bg);border-radius:12px;padding:10px}
.fare div{display:flex;justify-content:space-between;gap:8px}
.fare .lbl{color:var(--muted)}
.rec{font-size:14px;font-weight:500}
.fine{font-size:12px;color:var(--muted);line-height:1.45}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--ink);color:var(--bg);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--surface-2);color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

/* pages */
.page{display:grid;gap:12px;padding-top:8px}
.page h2{font-size:22px;margin-top:6px}
.lead{color:var(--muted);font-size:14px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0}
.panel h3{font-size:16px}
.panel p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;white-space:nowrap}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.callout{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--sun-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.ok{background:var(--ok-soft)}
.callout b{display:block;margin-bottom:2px}

/* course */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day header{display:flex;align-items:baseline;gap:10px;padding:12px 14px;background:var(--surface-2)}
.day header b{font-size:17px}
.day header span{color:var(--muted);font-size:13px}
.slot{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.slot time{font-weight:700;color:var(--accent);font-size:13.5px}
.slot .plink{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* fx calc */
.fx{display:grid;grid-template-columns:1fr;gap:8px}
.fx label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.fx input{font:inherit;font-size:18px;font-weight:700;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px}
.sheet .bar button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.sheet .bar .t{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo{border-radius:var(--r);background:linear-gradient(135deg,var(--surface-2),var(--accent-soft));aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:13.5px}
.photo b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.dhead{display:grid;gap:4px}
.dhead h2{font-size:24px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.src{font-size:11.5px;color:var(--muted)}

/* driver card */
.driver{position:fixed;inset:0;z-index:50;background:#FFFFFF;color:#0B0B0B;display:grid;align-content:center;gap:18px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.driver p{margin:0}
.driver .big{font-size:clamp(28px,8vw,44px);font-weight:700;line-height:1.2}
.driver .mid{font-size:clamp(18px,5vw,24px)}
.driver .ko2{font-size:14px;color:#555}
.driver button{justify-self:center;border:0;background:#0B0B0B;color:#fff;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:700}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;padding:4px 0;border-radius:10px}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:760px){.card{flex-basis:280px}}
</style>

<div class="wrap" id="app">
  <div class="loading" id="boot">지도를 불러오는 중…</div>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="driver" id="driver" hidden role="dialog" aria-label="기사님께 보여주기"></div>

<nav class="nav" aria-label="메뉴">
  <a href="#map" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>지도</a>
  <a href="#course" data-tab="course"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>코스</a>
  <a href="#prices" data-tab="prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>가격 가이드</a>
  <a href="#info" data-tab="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>여행 정보</a>
</nav>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON={
  restaurant:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 3c-2 1-3 3.5-3 7h3v11"/></svg>',
  cafe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9zM16 10h2a2.5 2.5 0 0 1 0 5h-2M8 3v3M12 3v3"/></svg>',
  convenience:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8zM9 8a3 3 0 0 1 6 0"/></svg>',
  pharmacy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pub:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12l-6 8-6-8zM12 12v8M8 20h8"/></svg>',
  hotel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7M5 10v10h14V10M10 20v-5h4v5"/></svg>'
};
const CATS=[
  {id:"all",label:"전체"},{id:"restaurant",label:"음식점"},{id:"cafe",label:"카페"},{id:"convenience",label:"편의점"},
  {id:"h24",label:"24시간"},{id:"pharmacy",label:"약국·병원"},{id:"pub",label:"펍"}
];
const CATLABEL={restaurant:"음식점",cafe:"카페",convenience:"편의점",pharmacy:"약국",pub:"펍"};
const TRIKE={cap:5, specialLo:100, specialHi:150, shared:25};

let D=null, MAP=null;
const S={n:7, cat:"all", sel:null, mode:"walk"};
try{const v=JSON.parse(localStorage.getItem("bora-state")||"{}"); if(v.n>=1&&v.n<=7)S.n=v.n; if(CATS.some(c=>c.id===v.cat))S.cat=v.cat;}catch(e){}
function save(){try{localStorage.setItem("bora-state",JSON.stringify({n:S.n,cat:S.cat}))}catch(e){}}

/* ---------- money ---------- */
const php=v=>"₱"+Math.round(v).toLocaleString("en-US");
const krw=v=>"₩"+(Math.round(v*D.fx.krw_per_php/100)*100).toLocaleString("ko-KR");
function rng(a,b,f){return a===b?f(a):f(a)+"–"+f(b).replace(/^[₱₩]/,"")}
function priceOf(m){return m==null?null:Array.isArray(m)?m:[m,m]}
function scMul(p){return p.sc?1+p.sc:1}
function groupCost(p,n){ if(!p.pp) return null; const k=n*scMul(p); return [p.pp[0]*k,p.pp[1]*k]; }
function trikes(n){return Math.ceil(n/TRIKE.cap)}
function chargeNote(p){
  const v=p.vat===true?"VAT 포함":p.vat===false?"VAT 별도":"VAT 표기 미확인";
  const s=p.sc?"서비스차지 "+Math.round(p.sc*100)+"% 별도(합계에 반영)":p.sc===0?"서비스차지 없음":"서비스차지 미확인";
  return v+" · "+s;
}

/* ---------- ranking ---------- */
function matches(p,cat){return cat==="all"||(cat==="h24"?!!p.h24:p.cat===cat)}
function score(p,n){
  const w=p.route.walk.min; const fit=p.groupFit||2;
  const big=(p.cat==="restaurant"||p.cat==="cafe"||p.cat==="pub");
  const pen=!big?0:n>=5?(3-fit)*6:n>=3?(3-fit)*2:0;
  return w+pen;
}
function ranked(){return D.places.filter(p=>matches(p,S.cat)).sort((a,b)=>score(a,S.n)-score(b,S.n))}
function fitBadge(p){
  if(!(p.cat==="restaurant"||p.cat==="cafe"||p.cat==="pub")) return "";
  if(S.n>=5&&p.groupFit===3) return '<span class="badge ok">'+S.n+'명 자리 OK</span>';
  if(S.n>=5&&p.groupFit===1) return '<span class="badge warn">'+S.n+'명엔 좁음</span>';
  return "";
}

function bindTop(){
  $(".seg").addEventListener("click",e=>{const b=e.target.closest("button[data-n]"); if(!b)return; S.n=+b.dataset.n; save();
    document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b)); refresh(false);});
  $(".chips").addEventListener("click",e=>{const b=e.target.closest(".chip"); if(!b)return; S.cat=b.dataset.cat; save();
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const list=ranked(); if(!list.some(p=>p.id===S.sel)) S.sel=list[0]?list[0].id:null; refresh(true);});
}
function refresh(fit){
  const list=ranked();
  if(!S.sel||!D.places.some(p=>p.id===S.sel)) S.sel=list[0]?list[0].id:null;
  const cat=CATS.find(c=>c.id===S.cat);
  $("#railTitle").textContent=(S.cat==="all"?"가까운 추천":cat.label+" 추천");
  $("#railNote").textContent=S.n+"명 기준 · "+list.length+"곳";
  $("#rail").innerHTML=list.length?list.map(cardHTML).join(""):'<div class="empty">이 조건에 맞는 장소가 없어요.</div>';
  MAP.setPins(D.places,p=>matches(p,S.cat),S.sel);
  if(fit) MAP.fitTo(list.length?list:D.places);
  renderReturn(); markCards();
}
function cardHTML(p){
  const gc=groupCost(p,S.n);
  const cost=gc?'<div class="cost num">'+rng(gc[0],gc[1],php)+' <small>'+S.n+'명 · '+rng(gc[0],gc[1],krw)+'</small></div>'

    '<button type="button" class="more" data-open="'+p.id+'">자세히</button></div></article>';

function markCards(){
  document.querySelectorAll(".card").forEach(c=>c.setAttribute("aria-current",c.dataset.id===S.sel));
}
function select(id,opts={}){
  S.sel=id; MAP.setPins(D.places,p=>matches(p,S.cat),S.sel); markCards(); renderReturn();
  const p=D.places.find(x=>x.id===id);
  if(opts.pan&&p) MAP.showRoute(p);
  if(opts.scroll){const c=document.querySelector('.card[data-id="'+id+'"]'); if(c) c.scrollIntoView({behavior:"smooth",inline:"start",block:"nearest"});}
}
function renderReturn(){
  const el=$("#ret"); if(!el) return;
  const p=D.places.find(x=>x.id===S.sel);
  if(!p){el.innerHTML='<div class="empty">장소를 선택하세요.</div>';return}
  el.innerHTML=returnHTML(p,true);
  MAP.setRoute(p.route[S.mode].p,S.mode);
}

function route(){
  const h=(location.hash||"#map").slice(1);
  if(h.startsWith("p-")){ if($("#cv")==null) {renderMapTab();} openPlace(h.slice(2)); setNav("map"); return; }
  closeSheet();
  const tab=["map","course","prices","info"].includes(h)?h:"map";
  if(tab==="map"){ if(!$("#cv")) renderMapTab(); else MAP.resize(); }
  else { MAP=null; ({course:renderCourse,prices:renderPrices,info:renderInfo})[tab](); window.scrollTo(0,0); }
  setNav(tab);
}
function setNav(t){document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); location.hash="p-"+o.dataset.open; return; }
  if(e.target.closest("[data-close]")){ history.length>1&&location.hash.startsWith("#p-")?history.back():(location.hash="map"); return; }
  const om=e.target.closest("[data-onmap]"); if(om){ const id=om.dataset.onmap; location.hash="map"; setTimeout(()=>{ if(MAP){ if(!matches(D.places.find(p=>p.id===id),S.cat)){S.cat="all";renderMapTab();} select(id,{pan:true,scroll:true}); $("#mapbox").scrollIntoView({block:"center"}); } },60); return; }
  const dr=e.target.closest("[data-driver]"); if(dr){ showDriver(D.places.find(p=>p.id===dr.dataset.driver)); return; }
  if(e.target.closest("[data-closedriver]")){ $("#driver").hidden=true; return; }

  const c=e.target.closest(".card"); if(c){ select(c.dataset.id,{pan:true}); return; }

function makeMap(box,cv,pinsEl){
  const ctx=cv.getContext("2d");
  const st={cx:-40,cy:-120,scale:0.5,w:0,h:0,dpr:1,route:null,mode:"walk",anim:0};
  let colors={};
  function readColors(){const cs=getComputedStyle(document.documentElement);
    ["sea","land","sand","green","pool","road","casing","path","label","halo","accent","sun","ink","surface"].forEach(k=>colors[k]=cs.getPropertyValue("--"+k).trim());}
  readColors();
  const mq=window.matchMedia("(prefers-color-scheme: dark)"); (mq.addEventListener?mq.addEventListener("change",()=>{readColors();draw()}):0);
  new MutationObserver(()=>{readColors();draw()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  const L=D.map;
  const pinMap={};
  function resize(){const r=box.getBoundingClientRect(); st.w=r.width; st.h=r.height; st.dpr=Math.min(window.devicePixelRatio||1,3);
    cv.width=Math.round(st.w*st.dpr); cv.height=Math.round(st.h*st.dpr); draw();}
  const sx=x=>(x-st.cx)*st.scale+st.w/2, sy=y=>(y-st.cy)*st.scale+st.h/2;
  function path(a,close){ctx.moveTo(sx(a[0]),sy(a[1])); for(let i=2;i<a.length;i+=2) ctx.lineTo(sx(a[i]),sy(a[i+1])); if(close) ctx.closePath();}
  function fillLayer(arr,col){ctx.beginPath(); arr.forEach(a=>path(a,true)); ctx.fillStyle=col; ctx.fill("evenodd");}
  function draw(){
    if(!st.w) return;
    ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
    ctx.fillStyle=colors.sea; ctx.fillRect(0,0,st.w,st.h);
    fillLayer(L.land,colors.land); fillLayer(L.green,colors.green); fillLayer(L.beach,colors.sand); fillLayer(L.water,colors.pool);
    ctx.lineCap="round"; ctx.lineJoin="round";
    const W={1:9,2:7,3:5.5,4:4,5:2.2};
    // paths
    ctx.beginPath(); L.roads.forEach(r=>{if(r.c===5) path(r.p)}); ctx.strokeStyle=colors.path; ctx.setLineDash([Math.max(2,3*st.scale*2),Math.max(2,2*st.scale*2)]); ctx.lineWidth=Math.max(1,W[5]*st.scale); ctx.stroke(); ctx.setLineDash([]);
    for(const pass of ["casing","fill"]){
      for(const c of [4,3,2,1]){
        ctx.beginPath(); L.roads.forEach(r=>{if(r.c===c) path(r.p)});
        const w=Math.max(c<=2?2.2:1.4,W[c]*st.scale);
        ctx.strokeStyle=pass==="casing"?colors.casing:colors.road; ctx.lineWidth=pass==="casing"?w+2:w; ctx.stroke();
      }
    }
    // route
    if(st.route){
      ctx.beginPath(); path(st.route); ctx.strokeStyle=colors.surface; ctx.lineWidth=8; ctx.stroke();
      ctx.beginPath(); path(st.route); ctx.strokeStyle=st.mode==="walk"?colors.accent:colors.sun; ctx.lineWidth=4.5;
      if(st.mode==="walk") ctx.setLineDash([7,6]); ctx.stroke(); ctx.setLineDash([]);
    }
    // labels
    ctx.font="600 12px "+getComputedStyle(document.body).fontFamily; ctx.textAlign="center"; ctx.textBaseline="middle";
    D.landmarks.forEach(l=>{const x=sx(l.x),y=sy(l.y); if(x<-50||x>st.w+50||y<-20||y>st.h+20) return;
      ctx.lineWidth=3.5; ctx.strokeStyle=colors.halo; ctx.strokeText(l.ko,x,y); ctx.fillStyle=colors.label; ctx.fillText(l.ko,x,y);});
    placePins();
  }
  function placePins(){
    for(const id in pinMap){const {el,p}=pinMap[id]; const x=sx(p.x),y=sy(p.y);
      el.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translate(-50%,-100%)";
      el.style.visibility=(x<-30||x>st.w+30||y<-10||y>st.h+40)?"hidden":"visible";}
    const hx=sx(0),hy=sy(0); hotel.style.transform="translate("+hx.toFixed(1)+"px,"+hy.toFixed(1)+"px) translate(-50%,-50%)";
  }
  const hotel=document.createElement("button"); hotel.type="button"; hotel.className="hotelpin"; hotel.setAttribute("aria-label","헤난 가든 리조트");
  hotel.innerHTML='<span class="b">'+ICON.hotel+'헤난 가든</span>'; pinsEl.appendChild(hotel);
  hotel.addEventListener("click",()=>{animateTo(0,0,Math.max(st.scale,0.9))});
  function setPins(list,on,sel){
    list.forEach(p=>{
      let o=pinMap[p.id];
      if(!o){const el=document.createElement("button"); el.type="button"; el.className="pin"; el.style.setProperty("--pc","var(--c-"+p.cat+")");
        el.innerHTML='<span class="b">'+ICON[p.cat]+'</span><span class="t">'+esc(p.name)+'</span>'; el.setAttribute("aria-label",p.name);
        el.addEventListener("click",ev=>{ev.stopPropagation(); select(p.id,{scroll:true});}); pinsEl.insertBefore(el,hotel); o=pinMap[p.id]={el,p};}
      const active=on(p);
      o.el.classList.toggle("dim",!active); o.el.classList.toggle("sel",p.id===sel); o.el.classList.toggle("h24",!!p.h24);
      o.el.style.zIndex=p.id===sel?3:active?2:1;
    });
    placePins();
  }
  function setRoute(pk,mode){st.route=pk; st.mode=mode; draw();}
  function bounds(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9; pts.forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)}); return [a,b,c,d]}
  function fitPts(pts,maxScale){
    const [a,b,c,d]=bounds(pts.concat([[0,0]])); const pad=48;
    const s=Math.min((st.w-pad*2)/Math.max(c-a,60),(st.h-pad*2-30)/Math.max(d-b,60));
    animateTo((a+c)/2,(b+d)/2+10/ s,Math.min(maxScale||1.6,Math.max(0.12,s)));
  }
  function fitTo(list){ const near=list.slice(0,8); fitPts(near.map(p=>[p.x,p.y]),1.4); }
  function showRoute(p){ const r=p.route[S.mode].p; const pts=[]; for(let i=0;i<r.length;i+=2) pts.push([r[i],r[i+1]]); pts.push([p.x,p.y]); fitPts(pts,1.8); }
  function animateTo(cx,cy,sc){
    const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const f={cx:st.cx,cy:st.cy,s:st.scale}; const t0=performance.now(); const dur=reduce?0:320; cancelAnimationFrame(st.anim);
    (function step(t){const k=dur?Math.min(1,(t-t0)/dur):1; const e=1-Math.pow(1-k,3);
      st.cx=f.cx+(cx-f.cx)*e; st.cy=f.cy+(cy-f.cy)*e; st.scale=f.s*Math.pow(sc/f.s,e); draw(); if(k<1) st.anim=requestAnimationFrame(step);})(t0);
  }
  function zoomAt(mx,my,k){ const ns=Math.min(4,Math.max(0.08,st.scale*k)); k=ns/st.scale;
    const wx=(mx-st.w/2)/st.scale+st.cx, wy=(my-st.h/2)/st.scale+st.cy;
    st.scale=ns; st.cx=wx-(mx-st.w/2)/st.scale; st.cy=wy-(my-st.h/2)/st.scale; draw(); }
  // gestures
  const pts=new Map(); let last=null, lastTap=0, moved=0;
  box.addEventListener("pointerdown",e=>{ if(e.target.closest(".mapctl")) return; if(e.target.closest(".pin,.hotelpin")) return; box.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; cancelAnimationFrame(st.anim); last=null; });
  box.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=box.getBoundingClientRect();
    if(pts.size===1){ const dx=e.clientX-prev.x, dy=e.clientY-prev.y; moved+=Math.abs(dx)+Math.abs(dy); st.cx-=dx/st.scale; st.cy-=dy/st.scale; draw(); }
    else if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
      if(last){ zoomAt(mx,my,d/last.d); st.cx-=(mx-last.mx)/st.scale; st.cy-=(my-last.my)/st.scale; draw(); } last={d,mx,my}; moved+=10; } });
  const up=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); last=null;
    if(pts.size===0&&moved<6&&e.type==="pointerup"){ const now=Date.now(); if(now-lastTap<300){ const r=box.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,1.8); lastTap=0;} else lastTap=now; } };
  box.addEventListener("pointerup",up); box.addEventListener("pointercancel",up);
  box.addEventListener("wheel",e=>{ e.preventDefault(); const r=box.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0018)); },{passive:false});
  box.querySelector("#zin").addEventListener("click",()=>animateTo(st.cx,st.cy,Math.min(4,st.scale*1.6)));
  box.querySelector("#zout").addEventListener("click",()=>animateTo(st.cx,st.cy,Math.max(0.08,st.scale/1.6)));
  box.querySelector("#zhome").addEventListener("click",()=>animateTo(0,-60,0.75));
  if(window.ResizeObserver) new ResizeObserver(resize).observe(box); else window.addEventListener("resize",resize);
  resize();
  return {setPins,setRoute,fitTo,showRoute,resize,draw,_st:st};
}

/* ---------- boot ---------- */
Promise.all([fetch("data.json").then(r=>r.json()),fetch("map.json").then(r=>r.json())]).then(([d,m])=>{
  D=d; D.map=m; route();
}).catch(err=>{ $("#app").innerHTML='<div class="loading">데이터를 불러오지 못했어요. 새로고침해 주세요.<br><small>'+esc(err.message)+'</small></div>'; });
})();
</script>
